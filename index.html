<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TMDB - Homepage</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#101827] min-h-screen m-0">
    <!-- Gemeinsamer Header -->
    <div id="site-header"></div>

    <!-- Homepage-Inhalt: beliebte Filme -->
    <main class="max-w-6xl mx-auto px-5 py-8">
      <h1 class="text-3xl font-bold text-white mb-6">Popular Movies</h1>
      <div
        id="movie-grid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>
    </main>

    <!-- Header JavaScript (muss vor main.js geladen werden) -->
    <script src="header.js"></script>

    <!-- Homepage JavaScript -->
    <script src="main.js"></script>
  </body>
</html>
